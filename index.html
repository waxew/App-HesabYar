<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <!-- ورودی مستقل نسخه وب حسابیار؛ دیگر از iframe یا پروژه واسط استفاده نمی‌کند. -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#315efb">
  <meta name="description" content="نسخه وب مستقل حسابیار برای محاسبه تخفیف، سود، درصد، مالیات و نقطه سربه‌سر">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="حسابیار">
  <meta name="web-build" content="2026-08-30.1">
  <title>حسابیار | Web PWA</title>
  <!-- Manifest مشخصات نصب نسخه وب را به مرورگر اعلام می‌کند. -->
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <!-- هدر ثابت نسخه وب. -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">ح</div>
      <div class="brand-copy">
        <strong>حسابیار</strong>
        <small>Web PWA · نسخه مستقل</small>
      </div>
    </div>
    <div class="header-actions">
      <button id="themeButton" class="icon-button" type="button" title="تغییر تم" aria-label="تغییر تم">◐</button>
      <a class="icon-button" href="https://github.com/waxew/App-HesabYar" target="_blank" rel="noopener noreferrer" title="GitHub" aria-label="GitHub" style="display:grid;place-items:center;text-decoration:none">↗</a>
    </div>
  </header>

  <!-- app.js تمام صفحات و ابزارهای محاسباتی را داخل این ناحیه Render می‌کند. -->
  <main id="app" class="page-shell"></main>

  <!-- وضعیت اتصال برای تست سریع حالت آفلاین PWA. -->
  <div id="connectionBadge" class="connection-badge">در حال بررسی…</div>

  <!-- نوار پایین مشترک صفحات اصلی. -->
  <nav class="bottom-nav" aria-label="ناوبری اصلی">
    <button class="nav-button is-active" type="button" data-nav="home"><b aria-hidden="true">⌂</b><span>خانه</span></button>
    <button class="nav-button" type="button" data-nav="history"><b aria-hidden="true">↺</b><span>تاریخچه</span></button>
    <button class="nav-button" type="button" data-nav="settings"><b aria-hidden="true">⚙</b><span>تنظیمات</span></button>
  </nav>

  <!-- وضعیت اولیه Worker برای Home در DOM نگهداری می‌شود و app.js آن را به‌روزرسانی می‌کند. -->
  <span id="workerStatus" class="is-hidden">در حال ثبت</span>

  <noscript>
    <div style="padding:24px;text-align:center;font-family:Tahoma,Arial,sans-serif">برای اجرای نسخه وب حسابیار JavaScript باید فعال باشد.</div>
  </noscript>

  <!-- فایل اصلی رابط و Calculation Engine وب. -->
  <script src="./app.js" defer></script>
</body>
</html>
