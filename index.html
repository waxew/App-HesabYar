<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <!-- ورودی مستقل نسخه وب حسابیار؛ رابط وب هم‌سطح‌تر با نسخه Android بارگذاری می‌شود. -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#315efb">
  <meta name="description" content="نسخه وب مستقل حسابیار با دستیار خرید و فروش، دفترچه قیمت، ابزارهای حرفه‌ای، گزارش و PWA آفلاین">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="حسابیار">
  <meta name="web-build" content="2026-08-30.2">
  <title>حسابیار | Web PWA</title>
  <!-- Manifest و آیکون برای نصب PWA. -->
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <!-- Design System پایه و سپس لایه parity رابط Android. -->
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./parity.css">
</head>
<body>
  <!-- هدر ثابت: منوی همبرگری در سمت راست و کنترل‌های عمومی در سمت چپ. -->
  <header class="topbar">
    <div class="brand">
      <button id="menuButton" class="icon-button" type="button" title="منوی حسابیار" aria-label="منوی حسابیار">☰</button>
      <div class="brand-mark" aria-hidden="true">ح</div>
      <div class="brand-copy">
        <strong>حسابیار</strong>
        <small>Web PWA · Android Parity</small>
      </div>
    </div>
    <div class="header-actions">
      <button id="themeButton" class="icon-button" type="button" title="تغییر تم" aria-label="تغییر تم">◐</button>
      <a class="icon-button" href="https://github.com/waxew/App-HesabYar" target="_blank" rel="noopener noreferrer" title="GitHub" aria-label="GitHub" style="display:grid;place-items:center;text-decoration:none">↗</a>
    </div>
  </header>

  <!-- صفحات برنامه توسط موتورهای Web داخل این ناحیه Render می‌شوند. -->
  <main id="app" class="page-shell"></main>

  <!-- وضعیت اتصال برای تست سریع PWA و حالت آفلاین. -->
  <div id="connectionBadge" class="connection-badge">در حال بررسی…</div>

  <!-- Bottom Navigation مطابق ساختار اصلی Android: خانه، گزارش، تاریخچه، تنظیمات. -->
  <nav class="bottom-nav" aria-label="ناوبری اصلی">
    <button class="nav-button is-active" type="button" data-nav="home"><b aria-hidden="true">⌂</b><span>خانه</span></button>
    <button class="nav-button" type="button" data-nav="reports"><b aria-hidden="true">▥</b><span>گزارش</span></button>
    <button class="nav-button" type="button" data-nav="history"><b aria-hidden="true">↺</b><span>تاریخچه</span></button>
    <button class="nav-button" type="button" data-nav="settings"><b aria-hidden="true">⚙</b><span>تنظیمات</span></button>
  </nav>

  <!-- وضعیت Worker برای صفحه تنظیمات. -->
  <span id="workerStatus" class="is-hidden">در حال ثبت</span>

  <noscript>
    <div style="padding:24px;text-align:center;font-family:Tahoma,Arial,sans-serif">برای اجرای نسخه وب حسابیار JavaScript باید فعال باشد.</div>
  </noscript>

  <!-- ابتدا موتور پایه محاسبات و سپس لایه قابلیت‌های Android اجرا می‌شود. -->
  <script src="./app.js" defer></script>
  <script src="./parity.js" defer></script>
</body>
</html>
