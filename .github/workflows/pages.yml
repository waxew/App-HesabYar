# انتشار مستقل نسخه وب حسابیار روی GitHub Pages.
name: Deploy Web PWA

on:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'parity.css'
      - 'compat.css'
      - 'app.js'
      - 'parity.js'
      - 'compat.js'
      - 'manifest.json'
      - 'sw.js'
      - 'icon.svg'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # قبل از انتشار Syntax تمام اسکریپت‌های Web و Service Worker بررسی می‌شود.
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check parity.js
          node --check compat.js
          node --check sw.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # فقط فایل‌های موردنیاز Web/PWA در Artifact عمومی قرار می‌گیرند.
      - name: Prepare web artifact
        run: |
          mkdir -p _site
          cp index.html styles.css parity.css compat.css app.js parity.js compat.js manifest.json sw.js icon.svg _site/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
