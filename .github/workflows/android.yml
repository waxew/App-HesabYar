# CI استاندارد حسابیار؛ فقط سورس واقعی مخزن را تست و Build می‌کند.
name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # دریافت همان Commitی که قرار است Test/Build شود.
      - name: Checkout
        uses: actions/checkout@v5

      # Android Gradle Plugin پروژه با JDK 17 تست می‌شود.
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # مخزن Wrapper ندارد؛ Gradle 8.9 به‌صورت کنترل‌شده در Runner آماده می‌شود.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Unit Test پیش از تولید APK اجرا می‌شود تا خطای موتورهای محاسباتی Release نشود.
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      # هر دو Variant ساخته می‌شوند تا خطای مخصوص Debug یا Release پنهان نماند.
      - name: Build APKs
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace

      # Debug برای تست توسعه نگهداری می‌شود.
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: HesabYar-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      # Release عمومی در CI بدون Keystore خصوصی ساخته می‌شود و خارج از GitHub امضا خواهد شد.
      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: HesabYar-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk

      # Snapshot دقیق سورس همان Build برای بسته تحویل خصوصی ذخیره می‌شود.
      - name: Prepare source snapshot
        run: |
          tar \
            --exclude=.git \
            --exclude=.gradle \
            --exclude='*/build' \
            --exclude='*/build/*' \
            -czf HesabYar-source-snapshot.tar.gz \
            .github .gitignore README.md VERSION.txt CHANGELOG.md ROADMAP.md \
            app build.gradle.kts gradle.properties settings.gradle.kts distribution

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: HesabYar-source-snapshot
          path: HesabYar-source-snapshot.tar.gz
