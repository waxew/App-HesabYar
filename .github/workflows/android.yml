# نام Workflow در تب Actions گیت‌هاب.
name: Android CI

# علاوه بر main، شاخه نسخه ۳ نیز برای Materialize و آزمون کامل Build اجرا می‌شود.
on:
  push:
    branches: [ main, feature/hesabyar-v3 ]
  pull_request:
    branches: [ main ]

# فقط Workflow شاخه feature اجازه دارد پس از Build موفق Overlay را به سورس واقعی تبدیل و Commit کند.
permissions:
  contents: write

# Job اصلی تست و Build حسابیار.
jobs:
  build:
    # Runner لینوکسی رسمی GitHub Actions.
    runs-on: ubuntu-latest

    # مراحل Job به ترتیب اجرا می‌شوند.
    steps:
      # سورس آخرین Commit را داخل Runner دریافت می‌کند.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # هنگام اولین اجرای شاخه v3، قطعات متنی Overlay به آرشیو اصلی برگردانده می‌شوند.
      # Checksum ثابت مانع Build سورس ناقص یا خراب می‌شود.
      - name: Materialize staged v3 source
        shell: bash
        run: |
          if compgen -G 'ci/v3-overlay.b64.part*' > /dev/null; then
            cat ci/v3-overlay.b64.part* | base64 -d > /tmp/hesabyar-v3-overlay.tar.gz
            echo '0bd0d543825d71e82dbbf4d9a097447a8462fe19f4688fbbf13fc9717b1e1595  /tmp/hesabyar-v3-overlay.tar.gz' | sha256sum -c -
            tar -xzf /tmp/hesabyar-v3-overlay.tar.gz -C .
          fi

      # JDK 17 همان نسخه‌ای است که تنظیمات Android Gradle Plugin هدف گرفته‌اند.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle 8.9 با AGP 8.7.3 سازگار است و چون Wrapper در این مخزن نیست، روی Runner نصب می‌شود.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # تست‌های موتور محاسبات قبل از ساخت APK اجرا می‌شوند.
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      # هر دو خروجی Debug و Release ساخته می‌شوند تا خطای BuildType پنهان نماند.
      - name: Build APKs
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace

      # APK Debug فقط برای تست توسعه به‌عنوان Artifact نگهداری می‌شود.
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: HesabYar-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      # APK Release در CI عمومی بدون کلید خصوصی ساخته می‌شود و بعداً خارج از مخزن امضا می‌شود.
      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: HesabYar-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk

      # یک Snapshot دقیق از همان سورسی که تست و Build شد می‌سازیم؛ فایل‌های Build و Git داخل آن قرار نمی‌گیرند.
      - name: Prepare source snapshot
        run: |
          tar \
            --exclude=.git \
            --exclude=.gradle \
            --exclude='*/build' \
            --exclude='*/build/*' \
            -czf HesabYar-source-snapshot.tar.gz \
            .github .gitignore README.md VERSION.txt CHANGELOG.md ROADMAP.md \
            app build.gradle.kts gradle.properties settings.gradle.kts distribution

      # Snapshot سورس برای ساخت ZIP خصوصی نهایی و نگهداری آرشیو هر Build آپلود می‌شود.
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: HesabYar-source-snapshot
          path: HesabYar-source-snapshot.tar.gz

      # فقط پس از عبور موفق تست و Build، Overlay به فایل‌های واقعی مخزن تبدیل می‌شود.
      # اجرای بعدی CI همین Commit واقعی را دوباره از صفر Build می‌کند.
      - name: Commit materialized v3 source
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feature/hesabyar-v3' }}
        shell: bash
        run: |
          if compgen -G 'ci/v3-overlay.b64.part*' > /dev/null; then
            rm -f ci/v3-overlay.b64.part*
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m 'Materialize HesabYar v3 source after successful CI'
              git push origin HEAD:feature/hesabyar-v3
            fi
          fi
